name = "SumDiffProof"
defaultTargets = ["SumDiffProof"]

# Pinned to the exact mathlib release named in the source headers.
# The matching Lean toolchain (leanprover/lean4:v4.32.1) is recorded in
# `lean-toolchain`; the resolved dependency commits are locked in
# `lake-manifest.json`.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[lean_lib]]
name = "SumDiffProof"
srcDir = "."
globs = [
  "SumDiffExponent",
  "SumDiffExponentColumn",
  "SumDiffExponentConstruction",
  "SumDiffExponentLimit",
  "SumDiffExponentMain",
  "SumDiffExponentQuantitative",
]
