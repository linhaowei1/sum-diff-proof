name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & verify the proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # leanprover/lean-action reads `lean-toolchain`, installs the matching
      # Lean via elan, fetches the pinned mathlib olean cache (`lake exe cache
      # get`) and runs `lake build`. A green run reproduces the verification.
      - name: Build with Lake (downloads mathlib cache)
        uses: leanprover/lean-action@v1

      - name: Print axiom footprint of the headline theorems
        run: lake env lean scripts/CheckAxioms.lean
